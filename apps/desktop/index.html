<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f0e7" />
    <title>Trace · 把此刻的一点，带到以后</title>
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23075540'/%3E%3Cpath d='M9 9h14M16 9v15' stroke='white' stroke-width='3'/%3E%3C/svg%3E" />
    <link rel="preload" as="image" href="./public/home/environment.png" fetchpriority="low" />
    <link rel="preload" as="font" href="./public/home/fonts/TraceHomeSerif-fixed.woff2" type="font/woff2" crossorigin />
    <link rel="preload" as="font" href="./public/home/fonts/TraceHomeSans-fixed.woff2" type="font/woff2" crossorigin />
    <link rel="modulepreload" href="./src/web-main.js" />
    <link rel="modulepreload" href="./runtime/product-workspace/index.mjs" />
    <link rel="modulepreload" href="./src/product/library.mjs" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/web-main.js"></script>
    <script>
      // Service-worker setup is an optional offline enhancement. Keep a small
      // allowlisted state on the document and emit a safe event so diagnostics
      // can distinguish a degraded offline cache from a page/runtime failure.
      const traceServiceWorkerStates = new Set(['registering', 'registered', 'ready', 'degraded']);
      const setTraceServiceWorkerState = (state, code) => {
        if (!traceServiceWorkerStates.has(state)) return;
        document.documentElement.dataset.traceServiceWorker = state;
        const detail = {state};
        if (state === 'degraded' && (code === 'PRECACHE_FAILED' || code === 'REGISTRATION_FAILED')) detail.code = code;
        window.dispatchEvent(new CustomEvent('trace:service-worker-status', {detail}));
      };
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        const observeWorker = worker => {
          if (!worker) return;
          const update = () => {
            if (worker.state === 'activated') setTraceServiceWorkerState('ready');
            else if (worker.state === 'redundant') setTraceServiceWorkerState('degraded', 'PRECACHE_FAILED');
          };
          worker.addEventListener('statechange', update);
          update();
        };
        navigator.serviceWorker.addEventListener('message', event => {
          const data = event.data;
          if (!data || data.type !== 'trace-sw-status') return;
          if (data.state === 'ready') setTraceServiceWorkerState('ready');
          else if (data.state === 'degraded' && data.code === 'PRECACHE_FAILED') setTraceServiceWorkerState('degraded', 'PRECACHE_FAILED');
        });
        setTraceServiceWorkerState('registering');
        navigator.serviceWorker.register('./sw.js').then(registration => {
          setTraceServiceWorkerState(registration.active ? 'ready' : 'registered');
          observeWorker(registration.installing || registration.waiting || registration.active);
        }, () => {
          // Registration is not a prerequisite for online rendering. Do not
          // expose the browser error object, which may contain local paths.
          setTraceServiceWorkerState('degraded', 'REGISTRATION_FAILED');
        });
      }
    </script>
  </body>
</html>
